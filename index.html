<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mira la luna🌙</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-y: auto;
  background:
    linear-gradient(rgba(0,0,0,0.36), rgba(0,0,0,0.36)),
    url('https://github.com/user-attachments/assets/ee35b9f1-ecec-4612-9a84-91478130cd2a') center/cover no-repeat;
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  position: relative;
}

.stars,.stars--mid,.stars--far,.moon-glow,.luna{
  position:fixed;
  pointer-events:none;
  z-index:0;
  inset:0;
}

.stars,.stars--mid,.stars--far{
  background-repeat:repeat;
  mix-blend-mode:screen;
  opacity:.32;
}

.stars{
  background-image:radial-gradient(circle,rgba(255,255,255,.9) .6px,transparent 1px);
  background-size:5px 5px;
  animation:twinkle 10s infinite linear;
}
.stars--mid{
  background-image:radial-gradient(circle,rgba(255,255,255,.85) 1px,transparent 1.5px);
  background-size:12px 12px;
  animation:twinkle 16s infinite linear;
}
.stars--far{
  background-image:radial-gradient(circle,rgba(255,255,255,.8) 1.6px,transparent 2.4px);
  background-size:24px 24px;
  animation:twinkle 26s infinite linear;
  filter:blur(.9px);
}

@keyframes twinkle{
  0%{opacity:.35}
  50%{opacity:.12}
  100%{opacity:.35}
}

.luna{
  inset:auto;
  top:72px;
  right:72px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff 0%,#f2f4f6 28%,#d7dbe0 54%);
}

h1,.contenedor,.sorpresa,.corazon{
  position:relative;
  z-index:4;
}

h1{
  margin-top:18px;
  color:#ffe6f2;
}

.contenedor{
  margin-top:18px;
  width:92%;
  max-width:420px;
  padding:14px;
  border-radius:10px;
  background:rgba(0,0,0,.6);
}

.pw-input{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:8px;
}

.pw-input input{
  padding:8px;
  border-radius:8px;
  border:none;
}

.pw-input button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#6bd3a8;
  cursor:pointer;
}

.status-ok{color:#b7ffcc;}
.status-err{color:#ffb6c1;}

.sorpresa{
  display:none;
  margin-top:18px;
  background:rgba(0,0,0,.36);
  padding:16px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="stars--mid"></div>
<div class="stars--far"></div>

<div class="luna"></div>

<h1>Viste? al final te gane</h1>
<p>te amo ❤️</p>

<div class="contenedor">
  <h2>Entrada ultra mega secreta booe💌</h2>
  <p>Escaneá QR o ingresá la contraseña</p>

  <div id="qr-preview">QR aqui (era invisible lol)</div>
  <input id="qrFile" type="file" accept="image/*" />

  <div style="margin-top:6px;">
    <button id="startCamera">Usar camara</button>
    <button id="fake-scan">QR de testeo</button>
  </div>

  <p id="status"></p>

  <label>O ingresá con la contraseña</label>

  <div class="pw-input">
    <input id="pw" type="password" placeholder="contraseña secreta">
    <button id="pwButton">Ingresar</button>
  </div>

  <div id="pwStatus"></div>
</div>

<div id="sorpresa" class="sorpresa">
  <p>Cuantos intentos habrás hecho amor 😆</p>
</div>

<div class="corazon">❤️‍🩹</div>

<script>
const SECRET_PASSWORD = "aceituna";

const pwInput = document.getElementById("pw");
const pwButton = document.getElementById("pwButton");
const pwStatus = document.getElementById("pwStatus");
const sorpresa = document.getElementById("sorpresa");
const qrFile = document.getElementById("qrFile");
const fakeScan = document.getElementById("fake-scan");

function showAccessGranted(source){
  sorpresa.style.display = "block";
  pwStatus.textContent = "✅ Acceso concedido ("+source+")";
  pwStatus.className = "status-ok";
}

function showAccessDenied(){
  pwStatus.textContent = "❌ Contraseña incorrecta";
  pwStatus.className = "status-err";
}

pwButton.addEventListener("click", ()=>{
  const val = pwInput.value || "";
  if(val === SECRET_PASSWORD){
    showAccessGranted("contraseña");
  }else{
    showAccessDenied();
  }
});

pwInput.addEventListener("keydown", e=>{
  if(e.key==="Enter") pwButton.click();
});

qrFile.addEventListener("change", ()=>{
  showAccessGranted("QR");
});

fakeScan.addEventListener("click", ()=>{
  showAccessGranted("QR simulado");
});
</script>

</body>
</html>
